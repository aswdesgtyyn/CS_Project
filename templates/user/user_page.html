<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Indigo Smart - User Page</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_app.css') }}">
    <script>
        function logout(){
            document.cookie = "user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location = "{{ url_for('home')}}";
        }
    </script>
</head>
<body>
<nav>
    <div class="logo" style ="align-items: centre;">Indigo Smart</div>
    <button class="btn back_btn" onclick = logout() style="float:right;">Logout</button>
</nav> 
<main>
    <c><h1>Welcome, {{ username }}!</h1></c>
    <img src="{{ url_for('static', filename='Avatar.png') }}" alt="User Avatar" width="200px">
    <div class="user_page_content">
        <p>This is your user dashboard !</p>
        <br><br>
        <button class="btn" onclick="window.location.href='{{ url_for('make_booking') }}'">Make a Booking</button>
        <button class="btn" onclick="window.location.href='{{ url_for('addresses') }}'">Addresses</button>
        <br><br><br><br><br><br><br><br>
        <p style="color:#cfcfcf">Indigo Smart, Making Your Rides more <b style="color:#0600ba">Indigo</b> Since 1933</p>
    </div>
</main>
<footer>
    &copy; 2025 Indigo Smart All Rights Reserved
</footer>
</body>
</html>
